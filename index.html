<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSPD — Investigative Report (Official Form)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #20232a;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* MAIN PAPER SHEET */
    .form-container {
      width: 100%;
      max-width: 820px;
      background-color: #f8f9fa;
      border: 1.5px solid #94a3b8;
      padding: 28px 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    @media (max-width: 600px) {
      .form-container { padding: 18px 14px; }
    }

    /* HEADER */
    .doc-header {
      text-align: center;
      margin-bottom: 18px;
      position: relative;
    }
    .doc-header img {
      width: 52px;
      height: auto;
      margin-bottom: 6px;
    }
    .doc-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #0f172a;
      text-transform: uppercase;
    }
    .doc-header h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #334155;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* STATUS BAR */
    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 1px solid #94a3b8;
      padding: 7px 12px;
      margin-bottom: 14px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 10px;
      border: 1.5px solid #dc2626;
      color: #dc2626;
      background: #fef2f2;
      text-transform: uppercase;
    }
    .status-pill.closed {
      border-color: #16a34a;
      color: #16a34a;
      background: #f0fdf4;
    }

    /* TABLE GRID CELLS */
    .grid-table {
      width: 100%;
      border: 1px solid #94a3b8;
      background: #ffffff;
      margin-bottom: 14px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; }
    .row-3 { display: grid; grid-template-columns: 1.2fr 0.9fr 0.9fr; }
    .row-4 { display: grid; grid-template-columns: 1.8fr 0.5fr 0.8fr 0.9fr; }
    .row-sus { display: grid; grid-template-columns: 45px 55px 75px 95px 1fr 30px; }
    
    @media (max-width: 600px) {
      .row-2, .row-3, .row-4 { grid-template-columns: 1fr; }
      .row-sus { grid-template-columns: 1fr; }
    }

    .cell {
      padding: 7px 10px;
      border-right: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
    }
    .cell:last-child { border-right: none; }
    .no-bottom { border-bottom: none; }

    .cell label {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .cell input, .cell select, .cell textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #0f172a;
      outline: none;
    }
    .cell input::placeholder, .cell textarea::placeholder {
      color: #94a3b8;
    }

    /* SECTION HEADINGS */
    .sec-heading {
      font-size: 11px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      margin: 14px 0 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-add-row {
      background: #334155;
      color: #ffffff;
      border: none;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
    }

    /* EXHIBIT SPOILER CARD */
    .exhibit-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      margin-bottom: 8px;
    }
    .exhibit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      gap: 8px;
    }
    .exhibit-header input[type="text"] {
      flex: 1;
      border: none;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      outline: none;
    }
    .btn-spoiler {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-del-small {
      background: #64748b;
      color: #fff;
      border: none;
      padding: 4px 7px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }
    .exhibit-body {
      padding: 10px;
      border-top: 1px dashed #cbd5e1;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .exhibit-preview {
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 1px solid #cbd5e1;
      display: none;
    }

    /* NARRATIVE BOX */
    .narrative-box {
      background: #ffffff;
      border: 1px solid #94a3b8;
      padding: 12px;
      margin-bottom: 14px;
    }
    .narrative-box label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .narrative-box textarea {
      width: 100%;
      min-height: 110px;
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      color: #1e293b;
      resize: vertical;
      outline: none;
    }

    /* BOTTOM ACTION BUTTONS */
    .controls {
      width: 100%;
      max-width: 820px;
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .act-btn {
      font-size: 12px;
      font-weight: 700;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-bbcode { background: #0f172a; }
    .btn-discord { background: #4f46e5; }
    .btn-png { background: #d97706; }

    @media print {
      body { background: #fff; padding: 0; }
      .form-container { box-shadow: none; border: 1px solid #94a3b8; }
      .controls { display: none; }
    }
  </style>
</head>
<body>

<div class="form-container" id="capture-area">
  <!-- HEADER -->
  <div class="doc-header">
    <img src="https://i.imgur.com/3fSSqST.png" alt="LSPD Logo">
    <h1>LOS SANTOS POLICE DEPARTMENT</h1>
    <h2>INVESTIGATIVE REPORT</h2>
  </div>

  <!-- CASE STATUS STRIP -->
  <div class="status-strip">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:10px; font-weight:700; color:#475569;">CASE STATUS:</span>
      <span class="status-pill" id="status-pill">OPEN</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <label style="font-size:10px; font-weight:700; color:#475569;">UBAH:</label>
      <select id="case_status" onchange="changeStatus(this.value)" style="font-size:11px; padding:2px 6px; border:1px solid #94a3b8; border-radius:3px;">
        <option value="OPEN">OPEN</option>
        <option value="CLOSED">CLOSED</option>
      </select>
    </div>
  </div>

  <!-- REPORT OF & INVEST DIV -->
  <div class="grid-table">
    <div class="row-2">
      <div class="cell no-bottom">
        <label>REPORT OF</label>
        <input type="text" id="report_of" placeholder="Murderer / Armed Robbery">
      </div>
      <div class="cell no-bottom">
        <label>INVEST DIV.</label>
        <select id="invest_div">
          <option>Harbor Patrol Division</option>
          <option>Harbor Detective Area</option>
          <option>Harbor Gang Detective</option>
          <option>Metropolitan Division</option>
          <option>Harbor Gang Impact Team</option>
        </select>
      </div>
    </div>
  </div>

  <!-- VICTIM -->
  <div class="sec-heading"><span>VICTIM</span></div>
  <div class="grid-table">
    <div class="row-4">
      <div class="cell">
        <label>FULL NAME</label>
        <input type="text" id="vic_name" placeholder="Angelina Ayyara">
      </div>
      <div class="cell">
        <label>SEX</label>
        <select id="vic_sex">
          <option>F</option>
          <option>M</option>
        </select>
      </div>
      <div class="cell">
        <label>DESC</label>
        <input type="text" id="vic_desc" placeholder="BLACK / WHITE / HISPANIC">
      </div>
      <div class="cell">
        <label>DOB</label>
        <input type="text" id="vic_dob" placeholder="12/03/2001">
      </div>
    </div>
    <div class="row-3">
      <div class="cell no-bottom">
        <label>ADDRESS</label>
        <input type="text" id="vic_address" placeholder="Los Santos, San Andreas">
      </div>
      <div class="cell no-bottom">
        <label>PHONE</label>
        <input type="text" id="vic_phone" placeholder="-">
      </div>
      <div class="cell no-bottom">
        <label>OCCUPATION</label>
        <input type="text" id="vic_occ" placeholder="Taxi Driver">
      </div>
    </div>
  </div>

  <!-- SUSPECT(S) -->
  <div class="sec-heading">
    <span>SUSPECT(S)</span>
    <button type="button" class="btn-add-row" onclick="addSuspect()">+ Tambah Suspect</button>
  </div>
  <div class="grid-table" id="suspect-table">
    <div class="row-sus suspect-row">
      <div class="cell no-bottom"><label>ID</label><input type="text" class="s-id" value="S-1"></div>
      <div class="cell no-bottom"><label>SEX</label><input type="text" class="s-sex" placeholder="M"></div>
      <div class="cell no-bottom"><label>DESC</label><input type="text" class="s-desc" placeholder="BLACK"></div>
      <div class="cell no-bottom"><label>DOB</label><input type="text" class="s-dob" placeholder="01/01/1999"></div>
      <div class="cell no-bottom"><label>NAME & ADDRESS (OR NAME & CHARGE, IF ARRESTED)</label><input type="text" class="s-info" placeholder="Unknown / Nama Tersangka & Pasal"></div>
      <div class="cell no-bottom" style="display:flex; align-items:center; justify-content:center;">
        <button type="button" class="btn-del-small" onclick="this.closest('.suspect-row').remove()">✕</button>
      </div>
    </div>
  </div>

  <!-- EVIDENCE(S) -->
  <div class="sec-heading">
    <span>EVIDENCE(S)</span>
    <button type="button" class="btn-add-row" onclick="addExhibit()">+ Tambah Exhibit</button>
  </div>
  <div id="exhibit-list" style="margin-bottom: 14px;">
    <div class="exhibit-card">
      <div class="exhibit-header">
        <input type="text" class="ex-title" value="Exhibit 1 — Deskripsi Barang Bukti">
        <button type="button" class="btn-spoiler" onclick="toggleExhibit(this)">👁️ Foto</button>
        <button type="button" class="btn-del-small" onclick="this.closest('.exhibit-card').remove()">✕</button>
      </div>
      <div class="exhibit-body">
        <input type="file" accept="image/*" onchange="loadExhibitImg(event, this)" style="font-size:11px;">
        <img class="exhibit-preview" src="" alt="Exhibit Preview">
      </div>
    </div>
  </div>

  <!-- NARRATIVE -->
  <div class="narrative-box">
    <label>NARRATIVE</label>
    <textarea id="narrative" placeholder="On Sunday, October 11, 2026, at approximately 13:40 HRS, Harbor Patrol Division Unit..."></textarea>
  </div>

  <!-- REPORTING & APPROVING PERSONNEL -->
  <div class="grid-table">
    <div class="row-3">
      <div class="cell">
        <label>REPORTING EMPLOYEE(S)</label>
        <input type="text" id="rep_emp" placeholder="Police Officer II Dwayne Tyler">
      </div>
      <div class="cell">
        <label>SERIAL NO.</label>
        <input type="text" id="rep_serial" placeholder="25770">
      </div>
      <div class="cell">
        <label>DIV/DETAIL</label>
        <input type="text" id="rep_div" placeholder="Harbor Patrol Division">
      </div>
    </div>
    <div class="row-3">
      <div class="cell">
        <label>SUPERVISOR APPROVING</label>
        <input type="text" id="sup_emp" placeholder="Sergeant I Theodore Delamour">
      </div>
      <div class="cell">
        <label>SERIAL NO.</label>
        <input type="text" id="sup_serial" placeholder="51548">
      </div>
      <div class="cell">
        <label>DIVISION</label>
        <input type="text" id="sup_div" placeholder="Harbor Patrol Division">
      </div>
    </div>
    <div class="row-3">
      <div class="cell no-bottom">
        <label>DETECTIVE SUPERVISOR APPROVING</label>
        <input type="text" id="det_emp" placeholder="Rank Firstname Lastname">
      </div>
      <div class="cell no-bottom">
        <label>SERIAL NO.</label>
        <input type="text" id="det_serial" placeholder="0000">
      </div>
      <div class="cell no-bottom">
        <label>DIVISION</label>
        <input type="text" id="det_div" placeholder="Division Name">
      </div>
    </div>
  </div>
</div>

<!-- BUTTONS -->
<div class="controls">
  <button class="act-btn btn-bbcode" onclick="copyBBCode()">📋 Copy BBCode Forum</button>
  <button class="act-btn btn-discord" onclick="copyDiscord()">💬 Copy Format Discord</button>
  <button class="act-btn btn-png" onclick="downloadPNG()">📷 Simpan Gambar (PNG)</button>
</div>

<script>
  function changeStatus(val) {
    const pill = document.getElementById("status-pill");
    pill.textContent = val;
    if (val === "CLOSED") {
      pill.classList.add("closed");
    } else {
      pill.classList.remove("closed");
    }
  }

  function addSuspect() {
    const table = document.getElementById("suspect-table");
    const count = table.querySelectorAll(".suspect-row").length + 1;
    const row = document.createElement("div");
    row.className = "row-sus suspect-row";
    row.style.borderTop = "1px solid #cbd5e1";
    row.innerHTML = `
      <div class="cell no-bottom"><label>ID</label><input type="text" class="s-id" value="S-${count}"></div>
      <div class="cell no-bottom"><label>SEX</label><input type="text" class="s-sex" placeholder="M"></div>
      <div class="cell no-bottom"><label>DESC</label><input type="text" class="s-desc" placeholder="BLACK"></div>
      <div class="cell no-bottom"><label>DOB</label><input type="text" class="s-dob" placeholder="01/01/1999"></div>
      <div class="cell no-bottom"><label>NAME & ADDRESS (OR NAME & CHARGE, IF ARRESTED)</label><input type="text" class="s-info" placeholder="Unknown / Nama Tersangka"></div>
      <div class="cell no-bottom" style="display:flex; align-items:center; justify-content:center;">
        <button type="button" class="btn-del-small" onclick="this.closest('.suspect-row').remove()">✕</button>
      </div>
    `;
    table.appendChild(row);
  }

  function addExhibit() {
    const list = document.getElementById("exhibit-list");
    const count = list.querySelectorAll(".exhibit-card").length + 1;
    const card = document.createElement("div");
    card.className = "exhibit-card";
    card.innerHTML = `
      <div class="exhibit-header">
        <input type="text" class="ex-title" value="Exhibit ${count} — Deskripsi Barang Bukti">
        <button type="button" class="btn-spoiler" onclick="toggleExhibit(this)">👁️ Foto</button>
        <button type="button" class="btn-del-small" onclick="this.closest('.exhibit-card').remove()">✕</button>
      </div>
      <div class="exhibit-body">
        <input type="file" accept="image/*" onchange="loadExhibitImg(event, this)" style="font-size:11px;">
        <img class="exhibit-preview" src="" alt="Exhibit Preview">
      </div>
    `;
    list.appendChild(card);
  }

  function toggleExhibit(btn) {
    const body = btn.closest(".exhibit-card").querySelector(".exhibit-body");
    body.style.display = body.style.display === "none" ? "flex" : "none";
  }

  function loadExhibitImg(event, input) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = input.parentElement.querySelector(".exhibit-preview");
      img.src = e.target.result;
      img.style.display = "block";
    };
    reader.readAsDataURL(file);
  }

  function copyDiscord() {
    const status = document.getElementById("case_status").value;
    let suspects = "";
    document.querySelectorAll(".suspect-row").forEach(r => {
      const id = r.querySelector(".s-id").value || "-";
      const sex = r.querySelector(".s-sex").value || "-";
      const desc = r.querySelector(".s-desc").value || "-";
      const dob = r.querySelector(".s-dob").value || "-";
      const info = r.querySelector(".s-info").value || "-";
      suspects += `> **[${id}]** Sex: ${sex} | Desc: ${desc} | DOB: ${dob} — ${info}\n`;
    });

    let exhibits = "";
    document.querySelectorAll(".ex-title").forEach(el => {
      if (el.value.trim()) exhibits += `> - ${el.value.trim()}\n`;
    });

    const txt = `**LOS SANTOS POLICE DEPARTMENT — INVESTIGATIVE REPORT**
**CASE STATUS:** \`${status}\`
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
* **REPORT OF:** ${document.getElementById("report_of").value || "-"}
* **INVEST DIV.:** ${document.getElementById("invest_div").value}

**[VICTIM]**
* **Full Name:** ${document.getElementById("vic_name").value || "-"} (${document.getElementById("vic_sex").value} / ${document.getElementById("vic_desc").value || "-"})
* **DOB:** ${document.getElementById("vic_dob").value || "-"} | **Phone:** ${document.getElementById("vic_phone").value || "-"}
* **Address:** ${document.getElementById("vic_address").value || "-"} | **Occupation:** ${document.getElementById("vic_occ").value || "-"}

**[SUSPECT(S)]**
${suspects || "> -\n"}
**[EVIDENCE(S)]**
${exhibits || "> -\n"}
**[NARRATIVE]**
${document.getElementById("narrative").value || "-"}

**[PERSONNEL]**
* **Reporting Employee:** ${document.getElementById("rep_emp").value || "-"} (#${document.getElementById("rep_serial").value || "-"}) — ${document.getElementById("rep_div").value || "-"}
* **Supervisor Approving:** ${document.getElementById("sup_emp").value || "-"} (#${document.getElementById("sup_serial").value || "-"}) — ${document.getElementById("sup_div").value || "-"}
* **Detective Supervisor:** ${document.getElementById("det_emp").value || "-"} (#${document.getElementById("det_serial").value || "-"}) — ${document.getElementById("det_div").value || "-"}`;

    navigator.clipboard.writeText(txt).then(() => alert("Format Discord berhasil disalin!"));
  }

  function copyBBCode() {
    const status = document.getElementById("case_status").value;
    let suspects = "";
    document.querySelectorAll(".suspect-row").forEach(r => {
      suspects += `[tr][td]${r.querySelector(".s-id").value}[/td][td]${r.querySelector(".s-sex").value}[/td][td]${r.querySelector(".s-desc").value}[/td][td]${r.querySelector(".s-dob").value}[/td][td]${r.querySelector(".s-info").value}[/td][/tr]\n`;
    });

    let exhibits = "";
    document.querySelectorAll(".ex-title").forEach(el => {
      exhibits += `[spoiler=${el.value}]Lampirkan Link Foto Disini[/spoiler]\n`;
    });

    const bb = `[divbox=white][center][img]https://i.imgur.com/3fSSqST.png[/img]
[b]LOS SANTOS POLICE DEPARTMENT[/b]
[b]INVESTIGATIVE REPORT[/b]
[b]CASE STATUS: ${status}[/b][/center]

[b]REPORT OF:[/b] ${document.getElementById("report_of").value || "-"}
[b]INVEST DIV.:[/b] ${document.getElementById("invest_div").value}

[b]VICTIM[/b]
[b]FULL NAME:[/b] ${document.getElementById("vic_name").value || "-"} | [b]SEX:[/b] ${document.getElementById("vic_sex").value} | [b]DESC:[/b] ${document.getElementById("vic_desc").value || "-"} | [b]DOB:[/b] ${document.getElementById("vic_dob").value || "-"}
[b]ADDRESS:[/b] ${document.getElementById("vic_address").value || "-"} | [b]PHONE:[/b] ${document.getElementById("vic_phone").value || "-"} | [b]OCCUPATION:[/b] ${document.getElementById("vic_occ").value || "-"}

[b]SUSPECT(S)[/b]
[table]${suspects}[/tabl
